{% extends 'base.html' %}

{% block title %}{% if material %}Editar Material{% else %}Nuevo Material{% endif %} - LabQuímica{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">

    <!-- Encabezado -->
    <div class="flex items-center justify-between">
        <div>
            <a href="{{ url_for('admin_materiales') }}" class="text-xs font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1 mb-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                Volver a Materiales
            </a>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">
                {% if material %}Editar Material / Equipo{% else %}Registrar Nuevo Material o Equipo{% endif %}
            </h1>
        </div>
    </div>

    <!-- Formulario -->
    <form action="{% if material %}{{ url_for('admin_material_editar', id=material.id) }}{% else %}{{ url_for('admin_material_nuevo') }}{% endif %}" method="POST"
        class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-5">

        <div>
            <label for="laboratorio_id" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Laboratorio Asignado <span class="text-rose-500">*</span>
            </label>
            <select name="laboratorio_id" id="laboratorio_id" required
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium focus:ring-2 focus:ring-teal-500">
                <option value="">-- Selecciona un Laboratorio --</option>
                {% for l in laboratorios %}
                <option value="{{ l.id }}" {% if (material and material.laboratorio_id == l.id) or (lab_id_param == l.id) %}selected{% endif %}>
                    {{ l.codigo }} - {{ l.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="nombre" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Nombre del Elemento / Equipo <span class="text-rose-500">*</span>
            </label>
            <input type="text" name="nombre" id="nombre" required value="{{ material.nombre if material else '' }}"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium focus:ring-2 focus:ring-teal-500"
                placeholder="Ej. Espectrofotómetro UV-Vis Shimadzu / Campana de extracción">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="categoria" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Categoría de Pañol <span class="text-rose-500">*</span>
                </label>
                <select name="categoria" id="categoria" required
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500">
                    {% for cat in categorias %}
                    <option value="{{ cat }}" {% if material and material.categoria == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="cantidad_disponible" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Cantidad / Unidades Disponibles <span class="text-rose-500">*</span>
                </label>
                <input type="number" name="cantidad_disponible" id="cantidad_disponible" min="1" max="1000" required
                    value="{{ material.cantidad_disponible if material else 1 }}"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500">
            </div>
        </div>

        <div>
            <label for="descripcion" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                Especificaciones Técnicas o Descripción de Uso
            </label>
            <textarea name="descripcion" id="descripcion" rows="3"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-teal-500"
                placeholder="Ej. Rango 190 a 1100 nm, con celdas de cuarzo y software de calibración...">{{ material.descripcion if material else '' }}</textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
            <a href="{{ url_for('admin_materiales') }}" class="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 text-xs font-bold hover:bg-slate-50 transition">
                Cancelar
            </a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold shadow-md transition flex items-center gap-1.5">
                <i data-lucide="check" class="w-4 h-4"></i>
                {% if material %}Guardar Cambios{% else %}Agregar Material{% endif %}
            </button>
        </div>

    </form>

</div>
{% endblock %}
