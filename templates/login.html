{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Administrador LabQuímica{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8">
    <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl space-y-6">
        
        <!-- Logotipo y Título -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-slate-900 to-teal-700 mx-auto flex items-center justify-center text-white shadow-lg shadow-teal-700/20">
                <i data-lucide="shield-check" class="w-7 h-7 text-teal-300"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight">Acceso Administrativo</h1>
            <p class="text-xs text-slate-500">
                Gestión de laboratorios, inventario de pañol y control de reservas
            </p>
        </div>

        <!-- Formulario -->
        <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Usuario o Correo Institucional
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-4 h-4"></i>
                    </span>
                    <input type="text" name="username" id="username" required autofocus
                        class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition shadow-sm"
                        placeholder="admin o admin@quimica.edu">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    Contraseña
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-4 h-4"></i>
                    </span>
                    <input type="password" name="password" id="password" required
                        class="w-full pl-10 pr-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition shadow-sm"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-teal-600 text-white font-bold text-sm shadow-md transition flex items-center justify-center gap-2">
                <i data-lucide="log-in" class="w-4 h-4"></i>
                Ingresar al Panel de Gestión
            </button>
        </form>

        <!-- Indicador de Credenciales por Defecto -->
        <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-center text-xs text-slate-500 space-y-0.5">
            <span class="font-bold text-slate-700 block">Credenciales iniciales del sistema:</span>
            <p>Usuario: <code class="font-mono font-bold text-teal-700">admin</code> • Clave: <code class="font-mono font-bold text-teal-700">admin123</code></p>
        </div>

    </div>
</div>
{% endblock %}
